<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <link rel="stylesheet" href="/style/reset.css" />
    <link rel="stylesheet" href="/style/normalize.css" />
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <header>
      <h1>
        <a href="/HTML/login.html">Login</a>
        <span>|</span>
        Register
      </h1>
    </header>

    <main>
      <p id="chapter">Enter your email and password to register.</p>
      <br />
      <form>
        <p>
          <input type="text" id="name" placeholder="Username" />
        </p>
        <br />
        <p>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
          />
        </p>
        <br />
        <p>
          <input type="password" id="password" placeholder="Password" />
        </p>
        <br />
        <p>
          <input
            type="password"
            id="confirmpassword"
            placeholder="Confirm Password"
          />
        </p>
        <br />
        <p>
          <button type="button" id="btn"><b>Register</b></button>
        </p>
        <br />
      </form>
    </main>

    <hr width="320" />
    <p id="AfterHR">Or register with</p>
    <br />
    <p>
      <button type="button">
        <img src="../images/google 1.png" alt="google" />
        Continue with Google
      </button>
    </p>
    <br />
    <p>
      <button type="button">
        <img src="../images/facebook 1.png" alt="facebook" />
        Continue with Facebook
      </button>
    </p>
  </body>
</html>
